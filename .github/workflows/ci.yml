name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check installed requirements
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m pip wheel --no-cache-dir --no-deps . --wheel-dir dist
      - name: Exercise the offline demo
        run: python -m visualsectors_toolkit demo --output toolkit-report.md
      - name: Confirm report outcomes
        run: |
          for section in \
            "## 1. Screener" \
            "## 2. Position sizing" \
            "## 3. Research agent" \
            "## 4. Risk management" \
            "## 5. Monitoring" \
            "## 6. Entry and exit planning"; do
            grep -Fq "$section" toolkit-report.md
          done
