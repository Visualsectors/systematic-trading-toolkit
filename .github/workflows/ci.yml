name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up context runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check installed requirements
        run: python -m pip check
      - name: Compile source, tool launchers, and tests
        run: python -m compileall -q src tests screener position-sizer research risk-management monitoring entry-exit
      - name: Build wheel
        run: python -m pip wheel --no-cache-dir --no-deps . --wheel-dir dist
      - name: Exercise the offline demo
        run: python -m visualsectors_toolkit demo --offline --output toolkit-report.md
      - name: Confirm report outcomes
        run: python -c "from pathlib import Path; text=Path('toolkit-report.md').read_text(encoding='utf-8'); assert all(f'## {n}.' in text for n in range(1, 7))"
